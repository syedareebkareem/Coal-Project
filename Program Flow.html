ffer)]:::memory\\n        B5[(finalMessage)]:::memory\\n    end\\n    H1 ~~~ Mem\\n\\n    %% Execution Flow Nodes\\n    N1(MAIN&amp;lt;br&amp;gt;Marukh):::marukh\\n    N2(DISPLAY_MENU&amp;lt;br&amp;gt;Marukh):::marukh\\n    N3(GET_INPUT&amp;lt;br&amp;gt;Mujeeb):::mujeeb\\n    N4(XOR_ENCRYPT&amp;lt;br&amp;gt;Mujeeb):::mujeeb\\n    N5(HIDE_MESSAGE&amp;lt;br&amp;gt;Areeb):::areeb\\n    N6(PRINT_ARRAY&amp;lt;br&amp;gt;Marukh):::marukh\\n    N7(EXTRACT_MESSAGE&amp;lt;br&amp;gt;Areeb):::areeb\\n    N8(XOR_DECRYPT&amp;lt;br&amp;gt;Mujeeb):::mujeeb\\n    N9(SHOW_RESULTS&amp;lt;br&amp;gt;Marukh):::marukh\\n\\n    %% Flow Connections\\n    Mem --&amp;gt; N1\\n    N1 --&amp;gt; N2 --&amp;gt; N3 --&amp;gt; N4 --&amp;gt; N5 --&amp;gt; N6 --&amp;gt; N7 --&amp;gt; N8 --&amp;gt; N9\\n\\n    %% Detailed Dry Run Nodes\\n    D1[\\&amp;quot;INITIALIZATION&amp;lt;br&amp;gt;MAIN allocates memory pointers.&amp;lt;br&amp;gt;All buffers empty. Key set to 05h.\\&amp;quot;]:::trace\\n    \\n    D2[\\&amp;quot;UI PROMPT&amp;lt;br&amp;gt;Clears screen, prints menu string.&amp;lt;br&amp;gt;Waits for user INT 21h.\\&amp;quot;]:::trace\\n    \\n    D3[\\&amp;quot;CAPTURE INPUT&amp;lt;br&amp;gt;Reads ASCII: &#39;A&#39;&amp;lt;br&amp;gt;Dec: 65 | Hex: 41h | Bin: 01000001&amp;lt;br&amp;gt;MOV [messageBuffer], AL\\&amp;quot;]:::trace\\n    \\n    D4[\\&amp;quot;ENCRYPTION LOGIC&amp;lt;br&amp;gt;MOV AL, [messageBuffer]&amp;lt;br&amp;gt;XOR AL, 05h  (65 XOR 5 = 68)&amp;lt;br&amp;gt;Result: 68 (&#39;D&#39;) | Bin: 01000100&amp;lt;br&amp;gt;MOV [encryptedBuffer], AL\\&amp;quot;]:::trace\\n    \\n    D5[\\&amp;quot;STEGANOGRAPHY: LSB MODIFICATION&amp;lt;br&amp;gt;MOV AL, [encryptedBuffer] (01000100)&amp;lt;br&amp;gt;Loop 8 times for pixelArray:&amp;lt;br&amp;gt;Bit 7 (0): AND AL, FEh -&amp;gt; OR AL, 0 -&amp;gt; Array[0]=100&amp;lt;br&amp;gt;Bit 6 (1): AND AL, FEh -&amp;gt; OR AL, 1 -&amp;gt; Array[1]=101&amp;lt;br&amp;gt;Bit 5 (0): AND AL, FEh -&amp;gt; OR AL, 0 -&amp;gt; Array[2]=100&amp;lt;br&amp;gt;Bit 4 (0): AND AL, FEh -&amp;gt; OR AL, 0 -&amp;gt; Array[3]=100&amp;lt;br&amp;gt;Bit 3 (0): AND AL, FEh -&amp;gt; OR AL, 0 -&amp;gt; Array[4]=100&amp;lt;br&amp;gt;Bit 2 (1): AND AL, FEh -&amp;gt; OR AL, 1 -&amp;gt; Array[5]=101&amp;lt;br&amp;gt;Bit 1 (0): AND AL, FEh -&amp;gt; OR AL, 0 -&amp;gt; Array[6]=100&amp;lt;br&amp;gt;Bit 0 (0): AND AL, FEh -&amp;gt; OR AL, 0 -&amp;gt; Array[7]=100\\&amp;quot;]:::trace\\n    \\n    D6[\\&amp;quot;VERIFICATION DISPLAY&amp;lt;br&amp;gt;Loops through pixelArray using CX.&amp;lt;br&amp;gt;Prints unmodified vs modified pixels.\\&amp;quot;]:::trace\\n    \\n    D7[\\&amp;quot;STEGANOGRAPHY: EXTRACTION&amp;lt;br&amp;gt;Read Array[0..7] LSBs using AND AL, 01h&amp;lt;br&amp;gt;Shift bits into BL using SHL and OR&amp;lt;br&amp;gt;Rebuilds: 01000100 (Decimal 68 / &#39;D&#39;)&amp;lt;br&amp;gt;MOV [extractedBuffer], BL\\&amp;quot;]:::trace\\n    \\n    D8[\\&amp;quot;DECRYPTION LOGIC&amp;lt;br&amp;gt;MOV AL, [extractedBuffer]&amp;lt;br&amp;gt;XOR AL, 05h  (68 XOR 5 = 65)&amp;lt;br&amp;gt;Result: 65 (&#39;A&#39;) | Bin: 01000001&amp;lt;br&amp;gt;MOV [finalMessage], AL\\&amp;quot;]:::trace\\n    \\n    D9[\\&amp;quot;FINAL OUTPUT&amp;lt;br&amp;gt;Prints string [finalMessage].&amp;lt;br&amp;gt;INT 21h, 4Ch to safely terminate.\\&amp;quot;]:::trace\\n\\n    %% Linking Flow to Dry Run\\n    H2 --&amp;gt; D1\\n    D1 --&amp;gt; D2 --&amp;gt; D3 --&amp;gt; D4 --&amp;gt; D5 --&amp;gt; D6 --&amp;gt; D7 --&amp;gt; D8 --&amp;gt; D9\\n    \\n    N1 -.-&amp;gt; D1\\n    N2 -.-&amp;gt; D2\\n    N3 -.-&amp;gt; D3\\n    N4 -.-&amp;gt; D4\\n    N5 -.-&amp;gt; D5\\n    N6 -.-&amp;gt; D6\\n    N7 -.-&amp;gt; D7\\n    N8 -.-&amp;gt; D8\\n    N9 -.-&amp;gt; D9&amp;quot;,&amp;#10;  &amp;quot;config&amp;quot;: null&amp;#10;}\&quot; id=\&quot;ZOGMSCvJmdI_N9yIvGe1-351\&quot;&gt;&lt;mxCell parent=\&quot;1\&quot; style=\&quot;shape=image;noLabel=1;verticalAlign=top;imageAspect=1;image=data:image/svg+xml,PHN2ZyBpZD0iZ2VNZXJtYWlkT3V0cHV0LTE3NzgzMTc4NDQxNzYiIHdpZHRoPSI
